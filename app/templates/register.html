<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Allo Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🩺</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Créer un compte</h1>
            <p class="text-slate-500">Rejoignez la communauté Allo Doctor</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nom Complet</label>
                <input type="text" id="full_name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Mot de passe</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Rôle</label>
                    <select id="role" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="patient">Patient</option>
                        <option value="doctor">Docteur</option>
                    </select>
                </div>
                <div id="spec-container" class="hidden">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Spécialité</label>
                    <input type="text" id="specialization" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                S'inscrire
            </button>
        </form>

        <p class="text-center text-slate-500 text-sm mt-6">
            Déjà un compte ? <a href="/login" class="text-blue-600 font-bold hover:underline">Se connecter</a>
        </p>
    </div>

    <script>
        // Registration form handling - inline for reliability
        document.getElementById('role').onchange = (e) => {
            document.getElementById('spec-container').classList.toggle('hidden', e.target.value !== 'doctor');
        };

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();

            // Form validation
            const full_name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            // Validate required fields
            if (!full_name) {
                alert('Veuillez entrer votre nom complet');
                return;
            }
            if (!email) {
                alert('Veuillez entrer votre email');
                return;
            }
            if (!password) {
                alert('Veuillez entrer un mot de passe');
                return;
            }
            if (password.length < 6) {
                alert('Le mot de passe doit contenir au moins 6 caractères');
                return;
            }

            // Validate email format
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Veuillez entrer une email valide');
                return;
            }

            const roleValue = role;
            const data = {
                full_name: full_name,
                email: email,
                password: password,
                role: roleValue
            };

            if (roleValue === 'doctor') {
                const specialization = document.getElementById('specialization').value.trim();
                if (!specialization) {
                    alert('Veuillez entrer votre spécialité');
                    return;
                }
                data.specialization = specialization;
            }

            // Show loading state on button
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Inscription en cours...';

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // Reset button state
                btn.disabled = false;
                btn.innerText = originalText;

                const result = await res.json();

                if (res.ok) {
                    if (result.access_token) {
                        localStorage.setItem('token', result.access_token);
                    }
                    window.location.href = '/register/success?role=' + encodeURIComponent(result.role);
                } else {
                    alert('Erreur: ' + (result.detail || 'Erreur inconnue'));
                }
            } catch (e) {
                console.error(e);
                alert('Une erreur est survenue');
                // Reset button state on error
                btn.disabled = false;
                btn.innerText = originalText;
            }
        };
    </script>
</body>
</html>
