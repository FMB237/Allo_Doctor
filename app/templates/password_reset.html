<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe | Allo Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🔑</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Nouveau mot de passe</h1>
            <p class="text-slate-500">Choisissez un nouveau mot de passe sécurisé</p>
        </div>
        <form id="reset-form" class="space-y-5">
            <input type="hidden" id="email">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nouveau mot de passe</label>
                <div class="relative">
                    <input type="password" id="new_password" required class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <button type="button" id="toggle-new" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Confirmer le mot de passe</label>
                <div class="relative">
                    <input type="password" id="confirm_password" required class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <button type="button" id="toggle-confirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                Réinitialiser
            </button>
        </form>
        <div id="toast" class="hidden fixed top-4 right-4 px-4 py-3 rounded-xl shadow-lg"></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('email').value = params.get('email') || '';
        // toggles
        ['new','confirm'].forEach((type,i)=>{
            const btn = document.getElementById('toggle-'+type);
            const inp = document.getElementById(type+'_password');
            btn.addEventListener('click',()=>{
                const isPwd = inp.type==='password';
                inp.type = isPwd?'text':'password';
                btn.innerHTML = isPwd?'<i class="fa-solid fa-eye-slash"></i>':'<i class="fa-solid fa-eye"></i>';
            });
        });
        document.getElementById('reset-form').onsubmit = async (e)=>{
            e.preventDefault();
            const email = document.getElementById('email').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            if(new_password!==confirm_password){
                showToast('Les mots de passe ne correspondent pas','bg-red-600');
                return;
            }
            const res = await fetch('/reset-password', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({email,new_password})
            });
            const data = await res.json();
            if(res.ok){
                showToast('Mot de passe réinitialisé avec succès','bg-green-600');
                setTimeout(()=>window.location.href='/login',2000);
            }else{
                showToast(data.detail||'Erreur','bg-red-600');
            }
        };
        function showToast(msg,cls){
            const t=document.getElementById('toast');
            t.textContent=msg;
            t.className='fixed top-4 right-4 '+cls+' text-white px-4 py-3 rounded-xl shadow-lg';
            t.classList.remove('hidden');
            setTimeout(()=>t.classList.add('hidden'),4000);
        }
    </script>
</body>
</html>
