<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe | Allo Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🔐</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Mot de passe oublié</h1>
            <p class="text-slate-500">Entrez votre email pour vérifier votre compte</p>
        </div>
        <form id="verify-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                Vérifier
            </button>
        </form>
        <p class="text-center text-slate-500 text-sm mt-6">
            <a href="/login" class="text-blue-600 font-bold hover:underline">Retour à la connexion</a>
        </p>
        <div id="toast" class="hidden fixed top-4 right-4 bg-red-600 text-white px-4 py-3 rounded-xl shadow-lg"></div>
    </div>
    <script>
        document.getElementById('verify-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const res = await fetch('/forgot-password/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email})
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/reset-password?email=' + encodeURIComponent(email);
            } else {
                const toast = document.getElementById('toast');
                toast.textContent = data.detail || 'Email invalide';
                toast.classList.remove('hidden');
                setTimeout(()=>toast.classList.add('hidden'), 4000);
            }
        };
    </script>
</body>
</html>
