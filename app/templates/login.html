<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Allo Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🩺</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Bon retour !</h1>
            <p class="text-slate-500">Connectez-vous à votre compte Allo Doctor</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="username" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="text-right mt-2">
                    <a href="/forgot-password" class="text-sm text-blue-600 hover:underline font-semibold">Mot de passe oublié ?</a>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                Se connecter
            </button>
        </form>

        <p class="text-center text-slate-500 text-sm mt-6">
            Pas encore de compte ? <a href="/register" class="text-blue-600 font-bold hover:underline">S'inscrire</a>
        </p>
    </div>

    <script>
        // Login form handling - inline for reliability
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();

            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerText;

            // Show loading state
            btn.disabled = true;
            btn.innerText = 'Connexion...';

            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch('/login', { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    const role = data.user.role;
                    if (role === 'doctor') {
                        window.location.href = '/doctor/dashboard';
                    } else if (role === 'admin') {
                        window.location.href = '/admin/dashboard';
                    } else {
                        window.location.href = '/patient/dashboard';
                    }
                } else {
                    alert('Email ou mot de passe incorrect');
                }
            } catch (e) {
                alert('Erreur de connexion');
            } finally {
                // Reset button state
                btn.disabled = false;
                btn.innerText = originalText;
            }
        };

        // Password visibility toggle
        const toggleBtn = document.getElementById('toggle-password');
        const pwdInput = document.getElementById('password');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                toggleBtn.innerHTML = isPassword ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
            });
        }
    </script>
</body>
</html>
