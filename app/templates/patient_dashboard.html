<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Patient | Allo Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-exit {
            animation: slideOut 0.3s ease-in forwards;
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
<base target="_blank">
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🩺</span>
                    <span class="text-xl font-bold text-slate-800">Allo<span class="text-blue-600">Doctor</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-name" class="text-sm font-medium text-slate-600">Chargement...</span>
                    <button onclick="logout()" class="text-sm font-semibold text-red-500 hover:text-red-700 transition">Déconnexion</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Welcome Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Bonjour, <span id="welcome-name" class="text-blue-600">Patient</span> 👋</h1>
            <p class="text-slate-500">Gérez vos rendez-vous et trouvez le spécialiste qu'il vous faut.</p>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex gap-4 mb-8 border-b border-slate-200">
            <button onclick="switchTab('directory')" id="tab-directory" class="pb-4 px-2 text-sm font-bold border-b-2 border-blue-600 text-blue-600 transition">
                <i class="fa-solid fa-user-doctor mr-2"></i>Trouver un Docteur
            </button>
            <button onclick="switchTab('my-appointments')" id="tab-appointments" class="pb-4 px-2 text-sm font-medium text-slate-500 hover:text-blue-600 transition">
                <i class="fa-solid fa-calendar-days mr-2"></i>Mes Rendez-vous
            </button>
        </div>

        <!-- Tab 1: Doctor Directory -->
        <div id="view-directory" class="block">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-specialty" placeholder="Rechercher une spécialité (ex: Cardiologue)..."
                           oninput="debouncedLoadDoctors()"
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
            </div>

            <div id="doctors-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Skeleton loading state -->
                <div class="skeleton h-48 w-full"></div>
                <div class="skeleton h-48 w-full"></div>
                <div class="skeleton h-48 w-full"></div>
            </div>
        </div>

        <!-- Tab 2: My Appointments -->
        <div id="view-my-appointments" class="hidden">
            <div id="appointments-list" class="grid gap-4">
                <div class="skeleton h-24 w-full"></div>
                <div class="skeleton h-24 w-full"></div>
            </div>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800">Prendre Rendez-vous</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6">
                <div id="modal-doctor-info" class="mb-6 p-4 bg-blue-50 rounded-2xl flex items-center gap-4"></div>
                <form id="booking-form" class="space-y-4">
                    <input type="hidden" id="modal-doctor-id">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Date et Heure</label>
                        <input type="datetime-local" id="appointment-time" required 
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <button type="submit" id="submit-booking" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="btn-text">Confirmer le Rendez-vous</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/patient_dashboard.js"></script>
</body>
</html>
